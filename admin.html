<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Kenneth Duron</title>

    <meta name="description"
        content="Admin dashboard for Kenneth Duron's live chat system. Monitor messages and respond to visitors in real time.">

    <link rel="stylesheet" href="css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <div class="sidebar">
        <h2>Admin Panel</h2>
        <a href="#">Dashboard</a>
        <a href="#messages-section">Messages</a>
        <a href="#">Settings</a>
    </div>

    <div class="admin-main">

        <header>
            <h1>Live Chat Dashboard</h1>
            <p>Monitor and respond to your visitors in real-time</p>
        </header>

        <div class="cards-grid">
            <div class="card">Active Visitors: <span id="active-visitors">0</span></div>
            <div class="card">Total Messages: <span id="total-messages">0</span></div>
        </div>

        <section id="messages-section" class="chat-section">
            <h2>Messages</h2>

            <div class="chat-panel">
                <div id="chatbox"></div>

                <div class="chat-input-area">
                    <input type="text" id="admin-name" placeholder="Admin Name">
                    <input type="text" id="admin-message" placeholder="Type a message...">
                    <button id="send-btn">Send</button>
                </div>

            </div>
        </section>

    </div>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCq1Su-S_uafe2NsgXXcrlx5P6GQYMVSaM",
            authDomain: "kenneth-live-chat.firebaseapp.com",
            databaseURL: "https://kenneth-live-chat-default-rtdb.firebaseio.com",
            projectId: "kenneth-live-chat",
            storageBucket: "kenneth-live-chat.firebasestorage.app",
            messagingSenderId: "971387555476",
            appId: "1:971387555476:web:62834def1c088a2242ae81"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const chatbox = document.getElementById("chatbox");
        const adminName = document.getElementById("admin-name");
        const adminMessage = document.getElementById("admin-message");
        const sendBtn = document.getElementById("send-btn");

        const activeVisitorsElem = document.getElementById("active-visitors");
        const totalMessagesElem = document.getElementById("total-messages");

        let visitorsSet = new Set();
        let totalMessages = 0;
        let currentVisitorID = null;

        onChildAdded(ref(db, "messages"), (data) => {

            const msg = data.val();

            if (msg.role === "client" && !currentVisitorID) {
                currentVisitorID = msg.visitorID;
            }

            visitorsSet.add(msg.visitorID);


            const div = document.createElement("div");

            div.classList.add(msg.role === "admin" ? "admin-msg" : "client-msg");

            div.innerHTML = `<strong>${msg.name}:</strong> ${msg.message}`;

            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;

            activeVisitorsElem.innerText = visitorsSet.size;

            totalMessages++;
            totalMessagesElem.innerText = totalMessages;

        });

        sendBtn.addEventListener("click", () => {

            const name = adminName.value.trim() || "Admin";
            const message = adminMessage.value.trim();

            if (!message) return;

            if (!currentVisitorID) {
                alert("No visitor selected yet.");
                return;
            }

            push(ref(db, "messages"), {
                name,
                message,
                role: "admin",
                visitorID: currentVisitorID,
                time: Date.now()
            });

            adminMessage.value = "";

        });

    </script>

</body>

</html>
