<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Chat Dashboard | Kenneth Duron</title>
    <meta name="description" content="Professional admin dashboard to manage live chat conversations in real time." />

    <link rel="stylesheet" href="css/admin.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="admin-layout">

        <!-- VISITORS SIDEBAR -->
        <aside class="visitors-panel">
            <div class="panel-header">Visitors</div>
            <ul id="visitorList" class="visitor-list"></ul>
        </aside>

        <!-- CHAT MAIN -->
        <main class="chat-panel">

            <!-- CHAT HEADER -->
            <header class="chat-header">
                <span id="currentVisitor">Select a visitor</span>
            </header>

            <!-- MESSAGES -->
            <section id="chatbox" class="messages"></section>

            <!-- INPUT -->
            <footer class="chat-input">
                <input type="text" id="admin-message" placeholder="Type your reply…" />
                <button id="send-btn">Send</button>
            </footer>

        </main>

    </div>

    <!-- =========================
     FIREBASE LOGIC (UNCHANGED)
========================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from
            "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCq1Su-S_uafe2NsgXXcrlx5P6GQYMVSaM",
            authDomain: "kenneth-live-chat.firebaseapp.com",
            databaseURL: "https://kenneth-live-chat-default-rtdb.firebaseio.com",
            projectId: "kenneth-live-chat",
            storageBucket: "kenneth-live-chat.firebasestorage.app",
            messagingSenderId: "971387555476",
            appId: "1:971387555476:web:62834def1c088a2242ae81"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const visitorList = document.getElementById("visitorList");
        const chatbox = document.getElementById("chatbox");
        const sendBtn = document.getElementById("send-btn");
        const adminMessage = document.getElementById("admin-message");
        const currentVisitor = document.getElementById("currentVisitor");

        let selectedVisitorID = null;

        /* LOAD VISITORS */
        onChildAdded(ref(db, "conversations"), snap => {
            const visitorID = snap.key;
            const li = document.createElement("li");
            li.textContent = visitorID;

            li.onclick = () => selectVisitor(visitorID, li);
            visitorList.appendChild(li);
        });

        function selectVisitor(id, el) {
            selectedVisitorID = id;
            currentVisitor.textContent = id;
            chatbox.innerHTML = "";

            document.querySelectorAll(".visitor-list li")
                .forEach(v => v.classList.remove("active"));
            el.classList.add("active");

            onChildAdded(ref(db, `conversations/${id}/messages`), snap => {
                const msg = snap.val();
                const div = document.createElement("div");
                div.className = msg.role === "admin" ? "msg admin" : "msg client";
                div.innerHTML = `<strong>${msg.name}</strong><span>${msg.message}</span>`;
                chatbox.appendChild(div);
                chatbox.scrollTop = chatbox.scrollHeight;
            });
        }

        /* SEND MESSAGE */
        sendBtn.onclick = () => {
            if (!selectedVisitorID) return alert("Select a visitor first");
            if (!adminMessage.value.trim()) return;

            push(ref(db, `conversations/${selectedVisitorID}/messages`), {
                name: "Admin",
                message: adminMessage.value,
                role: "admin",
                time: Date.now()
            });

            adminMessage.value = "";
        };
    </script>

</body>

</html>
