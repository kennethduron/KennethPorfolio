<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Chat Dashboard | Kenneth Duron</title>
    <meta name="description" content="Professional responsive admin chat dashboard." />

    <link rel="stylesheet" href="css/admin.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- MOBILE OVERLAY -->
    <div class="overlay" id="overlay"></div>

    <div class="admin-layout">

        <!-- VISITORS -->
        <aside class="visitors-panel" id="visitorsPanel">
            <div class="panel-header">Visitors</div>
            <ul id="visitorList" class="visitor-list"></ul>
        </aside>

        <!-- CHAT -->
        <main class="chat-panel">

            <header class="chat-header">
                <button class="burger" id="burger">☰</button>
                <span id="currentVisitor">Select a visitor</span>
            </header>

            <section id="chatbox" class="messages"></section>

            <footer class="chat-input">
                <input type="text" id="admin-message" placeholder="Type your reply…" />
                <button id="send-btn" style="cursor: pointer;">Send</button>
            </footer>

        </main>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from
            "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCq1Su-S_uafe2NsgXXcrlx5P6GQYMVSaM",
            authDomain: "kenneth-live-chat.firebaseapp.com",
            databaseURL: "https://kenneth-live-chat-default-rtdb.firebaseio.com",
            projectId: "kenneth-live-chat",
            storageBucket: "kenneth-live-chat.firebasestorage.app",
            messagingSenderId: "971387555476",
            appId: "1:971387555476:web:62834def1c088a2242ae81"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // DOM elements
        const visitorList = document.getElementById("visitorList");
        const chatbox = document.getElementById("chatbox");
        const sendBtn = document.getElementById("send-btn");
        const adminMessage = document.getElementById("admin-message");
        const currentVisitor = document.getElementById("currentVisitor");
        const burger = document.getElementById("burger");
        const visitorsPanel = document.getElementById("visitorsPanel");
        const overlay = document.getElementById("overlay");

        let selectedVisitorID = null;

        /* MOBILE MENU */
        burger.onclick = () => {
            visitorsPanel.classList.add("open");
            overlay.classList.add("show");
        };

        overlay.onclick = closeMenu;

        function closeMenu() {
            visitorsPanel.classList.remove("open");
            overlay.classList.remove("show");
        }

        /* LOAD VISITORS */
        onChildAdded(ref(db, "conversations"), snap => {
            const visitorID = snap.key;
            const li = document.createElement("li");
            li.textContent = visitorID;
            li.onclick = () => selectVisitor(visitorID, li);
            visitorList.appendChild(li);
        });

        function selectVisitor(id, el) {
            selectedVisitorID = id;
            currentVisitor.textContent = id;
            chatbox.innerHTML = "";

            document.querySelectorAll(".visitor-list li")
                .forEach(v => v.classList.remove("active"));
            el.classList.add("active");

            closeMenu();

            onChildAdded(ref(db, `conversations/${id}/messages`), snap => {
                const msg = snap.val();
                const div = document.createElement("div");
                div.className = msg.role === "admin" ? "msg admin" : "msg client";
                div.innerHTML = `<strong>${msg.name}:</strong><span> ${msg.message}</span>`;
                chatbox.appendChild(div);
                chatbox.scrollTop = chatbox.scrollHeight;
            });
        }

        function isMobile() {
            return /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);
        }


        /* SEND MESSAGE FUNCTION */
        function sendMessage() {
            if (!selectedVisitorID) return alert("Select a visitor first");

            const message = adminMessage.value.trim();
            if (!message) return;

            push(ref(db, `conversations/${selectedVisitorID}/messages`), {
                name: "Admin",
                message: message,
                role: "admin",
                time: Date.now()
            });

            adminMessage.value = "";
        }

        /* SEND MESSAGE BUTTON CLICK */
        sendBtn.addEventListener("click", sendMessage);

        /* SEND MESSAGE ON ENTER KEY */
        adminMessage.addEventListener("keydown", (e) => {

            // Only enable Enter-to-send on DESKTOP
            if (!isMobile()) {

                // Enter without Shift → send
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }

                // Shift + Enter → new line (default behavior)
            }

        });

    </script>


</body>

</html>
