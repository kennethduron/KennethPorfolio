<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Kenneth Duron</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <a href="#dashboard">Dashboard</a>
        <a href="#users">Users</a>
        <a href="#messages">Messages</a>
        <a href="#settings">Settings</a>
        <a href="#logout">Logout</a>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="admin-main">
        <h1 class="admin-header">Dashboard</h1>

        <!-- Cards -->
        <div class="cards-grid">
            <div class="card">Total Users: 124</div>
            <div class="card">Active Chats: <span id="active-chats">0</span></div>
            <div class="card">Pending Tickets: 3</div>
        </div>

        <!-- Chat Panel -->
        <div class="chat-panel">
            <div id="chatbox"></div>
            <div class="chat-input-area">
                <input type="text" id="name" placeholder="Your name">
                <input type="text" id="message" placeholder="Type your message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <!-- ===== FIREBASE ===== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCq1Su-S_uafe2NsgXXcrlx5P6GQYMVSaM",
            authDomain: "kenneth-live-chat.firebaseapp.com",
            databaseURL: "https://kenneth-live-chat-default-rtdb.firebaseio.com",
            projectId: "kenneth-live-chat",
            storageBucket: "kenneth-live-chat.firebasestorage.app",
            messagingSenderId: "971387555476",
            appId: "1:971387555476:web:62834def1c088a2242ae81"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const chatbox = document.getElementById("chatbox");
        const activeChatsElem = document.getElementById("active-chats");

        let activeClients = new Set();

        /* ========================
           🔥 RECEIVE MESSAGES
        ======================== */
        onChildAdded(ref(db, "messages"), (data) => {
            const msg = data.val();

            // Show in chatbox
            const div = document.createElement("div");
            div.classList.add(msg.role === "admin" ? "admin-msg" : "client-msg");
            div.innerHTML = `<strong>${msg.name}:</strong> ${msg.message}`;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;

            // Track active clients
            if (msg.role === "client") {
                activeClients.add(msg.name);
                activeChatsElem.innerText = activeClients.size;
            }
        });

        /* ========================
           🔥 ADMIN SEND MESSAGE
        ======================== */
        window.sendMessage = function () {
            const name = document.getElementById("name").value || "Admin";
            const message = document.getElementById("message").value;
            if (!message) return;

            push(ref(db, "messages"), {
                name,
                message,
                role: "admin",
                time: Date.now()
            });

            document.getElementById("message").value = "";
        };
    </script>

</body>

</html>
